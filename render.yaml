services:
  - type: web
    name: weather-prediction-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn prediction_api:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 5001
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase_credentials.json
