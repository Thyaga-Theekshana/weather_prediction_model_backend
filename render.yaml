services:
  - type: web
    name: weather-prediction-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:asgi_app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    envVars:
      - key: PORT
        value: 5001
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase_credentials.json
